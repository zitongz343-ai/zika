<body>
<div id="splash"><div class="sp"><div class="sp-mark">∞</div><div class="sp-title">字卡传讯</div><div class="sp-line"></div><div class="sp-sub" id="spSub">江月棠 × 顾时夜</div></div></div>
<div id="app">
  <div id="views">
    <section class="view on" data-view="home">
      <div class="home-head">
        <div class="hh-top"><span class="hh-date" id="hhDate"></span><div class="hh-acts"><button class="ico" id="btnStyle" aria-label="切换材质">◐</button><button class="ico" id="btnSet" aria-label="设置">⚙</button></div></div>
        <div class="hh-pair">
          <button class="hp" data-pick="me" aria-label="换我的头像"><span class="hp-wrap"><span class="hp-av" id="hpMe">🌙</span><span class="hp-cam">✎</span></span><span class="hp-nm" id="hnMe">江月棠</span></button>
          <span class="hp-link" style="display:none"></span>
          <button class="hp" data-pick="ta" aria-label="换他的头像"><span class="hp-wrap"><span class="hp-av" id="hpTa">✦</span><span class="hp-cam">✎</span></span><span class="hp-nm" id="hnTa">顾时夜</span></button>
        </div>
        <p class="hh-day" id="hhDay">还没有开始的日子</p>
      </div>
      <div class="quote"><p id="qText"></p><span>今日一句</span></div>
      <div class="entries">
        <button class="entry" data-go="chat"><b>传讯</b><span>一张一张递</span><em id="cChat"></em></button>
        <button class="entry" data-go="moments"><b>朋友圈</b><span>今天发生了什么</span><em id="cMo"></em></button>
        <button class="entry" data-go="mail"><b>信箱</b><span>寄出去，等他回</span><em id="cMail"></em></button>
        <button class="entry" data-go="tarot"><b>塔罗</b><span>问一句，抽一张</span><em id="cTarot"></em></button>
      </div>
    </section>
    <section class="view" data-view="chat">
      <div class="chat-top"><div class="pair"><button class="who" data-act="settings"><span class="av" id="avTa">✦</span><span class="nm" id="nmTa">顾时夜</span><span class="st">在线</span></button><span class="bond">∞</span><button class="who" data-act="settings"><span class="av" id="avMe">🌙</span><span class="nm" id="nmMe">江月棠</span><span class="st">在写字</span></button></div></div>
      <div id="stream"></div>
      <div class="chat-foot">
        <div class="send-row"><textarea id="input" rows="1" placeholder="写一句，递过去…"></textarea><button class="primary" id="btnSend">递出去</button></div>
      </div>
    </section>
    <section class="view" data-view="lib">
      <div class="mo-bar" style="padding-top:24px"><h3>字 卡 库</h3><span class="hh-date" id="libCount"></span></div>
      <div id="libPage"></div>
    </section>
    <section class="view" data-view="fav">
      <div class="mo-bar" style="padding-top:24px"><h3>收 藏</h3><span class="hh-date" id="favCount"></span></div>
      <div id="favList"></div>
    </section>
    <section class="view" data-view="moments">
      <div class="mo-cover"><span class="cname" id="moCoverName">朋友圈</span><span class="cdot" id="moCount"></span></div>
      <div class="mo-bar"><h3>动 态</h3><button class="ghost" data-act="newMoment">＋ 发一条</button></div>
      <div id="moList"></div>
    </section>
    <section class="view" data-view="mail">
      <div class="mo-bar" style="padding-top:24px"><h3>信 箱</h3><button class="ghost" data-act="newMail">＋ 写一封信</button></div>
      <div id="mailList"></div>
    </section>
    <section class="view" data-view="tarot">
      <div class="mo-bar" style="padding-top:24px"><h3>塔 罗</h3><span class="hh-date" id="tarotDate"></span></div>
      <div class="tarot-stage"><div class="tcard" id="tcard"><div class="tface tback">✧</div><div class="tface tfront" id="tfront"><span class="sym">✧</span><span class="nm">—</span><span class="en">—</span><span class="rev">—</span></div></div></div>
      <div class="tarot-info"><div class="ti-name" id="tiName">问一句，然后抽一张</div><p class="ti-mean" id="tiMean">心里先想一件事。不用说出来。</p></div>
      <div class="tarot-acts"><button class="primary" id="btnDraw">抽 一 张</button></div>
      <div class="draws"><h4>抽 过 的</h4><div id="drawList"></div></div>
    </section>
  </div>
</div>
<button id="navBtn" aria-label="打开侧栏"><span></span></button>
<div id="navMask"></div>
<aside id="sidebar" aria-label="导航">
  <div class="sb-head"><span class="sb-av" id="sbMe">🌙</span><span class="sb-link">∞</span><span class="sb-av" id="sbTa">✦</span></div>
  <div class="sb-names" id="sbNames">江月棠 × 顾时夜</div>
  <div class="sb-day" id="sbDay"></div>
  <nav class="sb-nav" id="tabbar">
    <button class="tab on" data-view="home"><i>⌂</i><span>主页</span><em></em></button>
    <button class="tab" data-view="chat"><i>▤</i><span>传讯</span><em id="sbcChat"></em></button>
    <button class="tab" data-view="lib"><i>❏</i><span>字卡库</span><em id="sbcLib"></em></button>
    <button class="tab" data-view="fav"><i>☆</i><span>收藏</span><em id="sbcFav"></em></button>
    <button class="tab" data-view="moments"><i>◍</i><span>朋友圈</span><em id="sbcMo"></em></button>
    <button class="tab" data-view="mail"><i>✉︎</i><span>信箱</span><em id="sbcMail"></em></button>
    <button class="tab" data-view="tarot"><i>✦</i><span>塔罗</span><em id="sbcTarot"></em></button>
  </nav>
  <div class="sb-foot"><button class="sb-mini" id="sbStyle">◐ 材质</button><button class="sb-mini" id="sbSet">⚙ 设置</button></div>
  <button class="sb-close" id="sbClose">‹ 收 起</button>
</aside>
<div class="sheet" id="sheet" hidden><div class="inner"><div class="sh"><h2 id="sheetTitle"></h2><button class="x" id="sheetX">×</button></div><div id="sheetBody"></div></div></div>
<div class="reader" id="reader" hidden><div class="letter"><div class="letter-head"><h3 id="rTitle"></h3><button class="x" id="rClose">×</button></div><div class="letter-body" id="rBody"></div><div class="letter-foot"><span class="from" id="rFrom"></span><div class="acts"><button class="ghost" id="rReply">回一封</button><button class="ghost" id="rDel">撕掉</button></div></div></div></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="avIn" accept="image/*" hidden>
