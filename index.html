<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4d4">
<title>字卡传讯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#efe4d4;--glow:#fff8ec;--ink:#3a322a;--sub:#9b8874;--line:rgba(90,70,50,.14);--paper-ta:#fffaf0;--paper-me:#fdeae7;--accent:#b07b62;--tape:rgba(206,178,142,.45);--shadow:0 6px 18px rgba(90,66,44,.10);--field:rgba(255,255,255,.55);--glass:rgba(255,250,240,.72)}
[data-theme="night"]{--bg:#17161c;--glow:#2b2733;--ink:#e7ded2;--sub:#8f8578;--line:rgba(255,255,255,.12);--paper-ta:#26232c;--paper-me:#2f262f;--accent:#c99c8b;--tape:rgba(255,255,255,.13);--shadow:0 6px 20px rgba(0,0,0,.45);--field:rgba(255,255,255,.07);--glass:rgba(26,24,30,.78)}
[data-theme="rose"]{--bg:#f6e3e3;--glow:#fff6f5;--ink:#42312f;--sub:#a98d88;--line:rgba(120,70,66,.14);--paper-ta:#fffafa;--paper-me:#fbdcdc;--accent:#b96f74;--tape:rgba(226,168,168,.4);--shadow:0 6px 18px rgba(120,70,66,.10);--field:rgba(255,255,255,.6);--glass:rgba(255,247,246,.75)}
[data-theme="sage"]{--bg:#e4e9df;--glow:#f6faf1;--ink:#303a31;--sub:#7d8a7c;--line:rgba(60,80,60,.15);--paper-ta:#fbfdf6;--paper-me:#e4efe3;--accent:#6f8a6d;--tape:rgba(170,190,160,.4);--shadow:0 6px 18px rgba(60,80,60,.10);--field:rgba(255,255,255,.55);--glass:rgba(246,250,242,.75)}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);background:radial-gradient(120% 60% at 50% -20%,var(--glow),transparent 70%),var(--bg);font-family:"Songti SC","Noto Serif SC",ui-serif,Georgia,"PingFang SC",serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 92px;display:none;scrollbar-width:none;animation:vin .28s ease}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 60% at 50% 40%,var(--glow),transparent 75%),var(--bg);transition:opacity .55s,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.sp{text-align:center;transform:translateY(-6vh)}
.sp-mark{font-size:56px;line-height:1;color:var(--accent);opacity:0;animation:markIn 1.1s cubic-bezier(.2,.8,.3,1) .1s forwards}
.sp-title{margin-top:14px;font-size:22px;letter-spacing:.42em;text-indent:.42em;opacity:0;animation:fadeUp .8s ease .45s forwards}
.sp-line{height:1px;background:var(--line);margin:18px auto 0;width:0;animation:lineIn .9s cubic-bezier(.3,.9,.3,1) .75s forwards}
.sp-sub{margin-top:14px;font-size:11px;letter-spacing:.28em;color:var(--sub);opacity:0;animation:fadeUp .8s ease 1s forwards}
@keyframes markIn{from{opacity:0;transform:scale(.7)}to{opacity:.9;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lineIn{to{width:120px}}
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:5px 0 3px;color:var(--sub);font:inherit;font-size:10px;letter-spacing:.1em;cursor:pointer;transition:color .2s}
.tab i{font-style:normal;font-size:17px;line-height:1.1;opacity:.85}
.tab.on{color:var(--accent)}
.tab.on i{opacity:1}
.ico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--field);color:var(--sub);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.ghost{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:12.5px;letter-spacing:.08em;cursor:pointer}
.primary{padding:9px 20px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:13.5px;letter-spacing:.14em;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.primary:active{transform:translateY(1px)}
.hint{font-size:11.5px;color:var(--sub);line-height:1.9;margin:10px 0 0}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:2.1;border:1px dashed var(--line);border-radius:12px;padding:26px 20px;margin:18px 0}
.empty b{display:block;font-size:15px;color:var(--ink);font-weight:400;margin-bottom:6px;letter-spacing:.08em}
.home-head{padding:22px 2px 6px}
.hh-top{display:flex;align-items:center;justify-content:space-between}
.hh-date{font-size:11px;color:var(--sub);letter-spacing:.16em}
.hh-names{margin:18px 0 0;font-size:26px;font-weight:400;letter-spacing:.1em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hh-names i{font-style:normal;color:var(--accent);opacity:.7;font-size:19px}
.hh-day{margin:10px 0 0;font-size:12px;color:var(--sub);letter-spacing:.14em}
.quote{margin:22px 0 20px;padding:18px 18px 16px;border-radius:4px;background:var(--paper-ta);box-shadow:var(--shadow);position:relative}
.quote::before{content:"“";position:absolute;left:8px;top:2px;font-size:34px;color:var(--accent);opacity:.28}
.quote p{margin:0;padding-left:16px;font-size:14.5px;line-height:1.95}
.quote span{display:block;margin-top:8px;padding-left:16px;font-size:10.5px;color:var(--sub);letter-spacing:.12em}
.entries{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.entry{text-align:left;padding:16px 15px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--paper-ta);color:var(--ink);font:inherit;box-shadow:0 3px 10px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:transform .18s}
.entry:active{transform:scale(.985)}
.entry b{font-size:15px;font-weight:400;letter-spacing:.1em}
.entry span{font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.entry em{position:absolute;right:12px;top:12px;font-style:normal;font-size:10.5px;color:var(--accent);opacity:.8}
.home-foot{margin-top:26px;text-align:center;font-size:10.5px;color:var(--sub);letter-spacing:.1em;opacity:.8}
#v-chat{padding:0}
.chat-top{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
.pair{display:flex;align-items:center;gap:8px;flex:1}
.who{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:2px;color:inherit;font:inherit;cursor:pointer}
.who:active{opacity:.6}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--paper-ta);border:1px solid var(--line);box-shadow:var(--shadow)}
.nm{font-size:12.5px;letter-spacing:.06em}
.st{font-size:9.5px;color:var(--sub);letter-spacing:.08em}
.bond{color:var(--sub);font-size:14px;opacity:.7;padding-bottom:15px}
#stream{flex:1;overflow-y:auto;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#stream::-webkit-scrollbar{display:none}
#v-chat.on{display:flex;flex-direction:column;padding-bottom:0}
.card{position:relative;max-width:84%;padding:12px 15px 28px;border-radius:3px;background:var(--paper-ta);box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));transition:transform .28s,box-shadow .28s;animation:pop .34s cubic-bezier(.2,.8,.3,1) both}
.card.me{align-self:flex-end;background:var(--paper-me)}
.card.ta{align-self:flex-start}
.card:hover{transform:rotate(0)}
@keyframes pop{from{opacity:0;transform:translateY(9px) rotate(var(--tilt,0deg)) scale(.985)}}
.card::before{content:"";position:absolute;top:-8px;left:50%;width:54px;height:15px;transform:translateX(-50%) rotate(-1.6deg);background:var(--tape);border-left:1px dashed rgba(255,255,255,.35);border-right:1px dashed rgba(255,255,255,.35)}
.card.ta::before{left:22%;transform:rotate(-2.4deg)}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:10.5px;color:var(--sub);letter-spacing:.05em}
.head .n{color:var(--accent);letter-spacing:.1em}
.body{margin:0;font-size:15.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;letter-spacing:.02em}
.seal{position:absolute;right:10px;bottom:9px;width:26px;height:26px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-size:11px;color:var(--accent);opacity:.45;transform:rotate(-9deg);pointer-events:none}
.del{position:absolute;left:9px;bottom:6px;border:0;background:none;padding:3px;font:inherit;font-size:10.5px;color:var(--sub);cursor:pointer;opacity:0;transition:opacity .2s}
.card.show-del .del{opacity:.85}
.chat-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px dashed var(--line);flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab2{flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:12.5px;letter-spacing:.1em;cursor:pointer;transition:.2s}
.tab2.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:46px;max-height:120px;resize:none;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:15px;line-height:1.7;outline:none}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--sub);opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.mo-cover{margin:0 -16px;height:132px;position:relative;background:linear-gradient(160deg,var(--paper-me),var(--paper-ta));border-bottom:1px solid var(--line)}
.mo-cover .cname{position:absolute;left:18px;bottom:12px;font-size:19px;letter-spacing:.14em}
.mo-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px}
.mo-bar h3{margin:0;font-size:13px;font-weight:400;letter-spacing:.16em;color:var(--sub)}
.mo{display:flex;gap:11px;padding:15px 2px;border-bottom:1px solid var(--line)}
.mo-av{flex:0 0 auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:var(--paper-ta);border:1px solid var(--line)}
.mo-main{flex:1;min-width:0}
.mo-name{font-size:12.5px;color:var(--accent);letter-spacing:.08em}
.mo-text{margin:5px 0 0;font-size:14.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.mo-img{margin-top:8px;height:92px;border-radius:6px;display:grid;place-items:center;font-size:34px;background:linear-gradient(140deg,var(--paper-me),var(--paper-ta));border:1px solid var(--line)}
.mo-meta{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.mo-meta button{border:0;background:none;font:inherit;font-size:10.5px;color:var(--sub);cursor:pointer;padding:2px 0;letter-spacing:.06em}
.mo-meta button.liked{color:var(--accent)}
.mo-cmts{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--field);font-size:12.5px;line-height:1.85}
.mo-cmts b{font-weight:400;color:var(--accent);margin-right:6px}
.mail{position:relative;margin:14px 0;padding:15px 16px;border-radius:6px;cursor:pointer;background:var(--paper-ta);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .3s ease both}
.mail-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mail-title{font-size:15px;letter-spacing:.06em}
.mail-date{font-size:10.5px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
.mail-from{margin-top:6px;font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.mail-prev{margin:7px 0 0;font-size:12.5px;color:var(--sub);line-height:1.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mail.unread::after{content:"";position:absolute;right:14px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.reader{position:fixed;inset:0;z-index:60;background:rgba(20,14,10,.45);display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(4px);animation:fade .2s}
.reader[hidden]{display:none!important}
@keyframes fade{from{opacity:0}}
.letter{width:100%;max-width:430px;max-height:82dvh;display:flex;flex-direction:column;background:var(--paper-ta);border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:22px 20px 18px;position:relative;animation:up .3s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
.letter::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;background:repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px);opacity:.5}
.letter-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;position:relative}
.letter-head h3{margin:0;font-size:17px;font-weight:400;letter-spacing:.08em}
.letter-body{position:relative;margin:16px 0 0;flex:1;overflow-y:auto;font-size:15px;line-height:32px;white-space:pre-wrap;word-break:break-word}
.letter-foot{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.letter-foot .from{font-size:11.5px;color:var(--accent);letter-spacing:.12em}
.letter-foot .acts{display:flex;gap:8px}
.tarot-stage{height:270px;display:grid;place-items:center;perspective:1000px;margin-top:12px}
.tcard{width:158px;height:236px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.tcard.flipped{transform:rotateY(180deg)}
.tcard.shake{animation:shk .5s ease}
@keyframes shk{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-3deg) translateX(-6px)}75%{transform:rotate(3deg) translateX(6px)}}
.tface{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--line)}
.tback{background:radial-gradient(circle at 50% 40%,var(--paper-me),var(--paper-ta));color:var(--accent);font-size:34px}
.tback::after{content:"";position:absolute;inset:10px;border:1px solid var(--accent);opacity:.25;border-radius:4px}
.tfront{background:var(--paper-ta);transform:rotateY(180deg);padding:14px;text-align:center}
.tfront .sym{font-size:46px;line-height:1}
.tfront .nm{font-size:15px;letter-spacing:.14em;color:var(--accent)}
.tfront .en{font-size:9.5px;color:var(--sub);letter-spacing:.12em}
.tfront .rev{font-size:10px;color:var(--sub);letter-spacing:.2em}
.tarot-info{margin-top:6px;min-height:96px;text-align:center}
.tarot-info .ti-name{font-size:16px;letter-spacing:.12em}
.tarot-info .ti-mean{margin:9px auto 0;max-width:330px;font-size:13px;line-height:1.95;color:var(--sub)}
.tarot-acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.draws{margin-top:22px;border-top:1px dashed var(--line);padding-top:12px}
.draws h4{margin:0 0 8px;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:.16em}
.dr{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:6px 0}
.dr b{font-weight:400;color:var(--ink);letter-spacing:.06em}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,14,10,.4);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fade .2s}
.sheet[hidden]{display:none!important}
.inner{width:100%;max-width:520px;max-height:80dvh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up2 .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up2{from{transform:translateY(24px);opacity:.5}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:15px;font-weight:400;letter-spacing:.12em}
.x{border:0;background:none;color:var(--sub);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:14px;outline:none}
.field textarea{min-height:120px;line-height:1.85;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.two{display:flex;gap:10px}
.two .field{flex:1}
.swatches{display:flex;gap:12px;margin:4px 0 16px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;padding:0}
.sw.on{border-color:var(--accent)}
.sw i{position:absolute;inset:6px;border-radius:50%;display:block}
.menu-list{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.mi:last-child{border-bottom:0}
.mi span{color:var(--sub);font-size:11.5px}
.lib-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.lt{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:12px;cursor:pointer}
.lt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.librow{position:relative}
.librow .li{padding-right:40px}
.librow .rm{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:17px;line-height:1;cursor:pointer;padding:8px}
.li{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--paper-ta);color:var(--ink);font:inherit;font-size:14px;line-height:1.75;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.day{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.day .t{color:var(--accent);font-size:11px;letter-spacing:.06em;white-space:nowrap}
.day .d{color:var(--sub);font-size:11px;margin-left:8px}
.day button{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:4px}
.pick{display:flex;gap:8px;margin-bottom:12px}
.pick button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
.pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="splash">
  <div class="sp">
    <div class="sp-mark">∞</div>
    <div class="sp-title">字卡传讯</div>
    <div class="sp-line"></div>
    <div class="sp-sub" id="spSub">江月棠 × 他</div>
  </div>
</div>
<div id="app">
  <div id="views">
    <section class="view on" data-view="home">
      <div class="home-head">
        <div class="hh-top"><span class="hh-date" id="hhDate"></span><button class="ico" id="btnSet">⚙</button></div>
        <h1 class="hh-names"><span id="hnMe">江月棠</span><i>∞</i><span id="hnTa">他</span></h1>
        <p class="hh-day" id="hhDay">还没有开始的日子</p>
      </div>
      <div class="quote"><p id="qText"></p><span>今日一句</span></div>
      <div class="entries">
        <button class="entry" data-go="chat"><b>传讯</b><span>一张一张递</span><em id="cChat">0</em></button>
        <button class="entry" data-go="moments"><b>朋友圈</b><span>今天发生了什么</span><em id="cMo">0</em></button>
        <button class="entry" data-go="mail"><b>回信</b><span>慢慢写的那一种</span><em id="cMail">0</em></button>
        <button class="entry" data-go="tarot"><b>塔罗</b><span>问一句，抽一张</span><em id="cTarot">0</em></button>
      </div>
      <p class="home-foot">字都在这一台机器上，不上传</p>
    </section>

function defaults(){return{me:{name:'江月棠',avatar:'🌙'},ta:{name:'他',avatar:'✦'},theme:'paper',cards:[],days:[],lib:LIB_DEFAULT.slice(),moments:[],mails:[],draws:[],from:'me',view:'home'}}
var S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||typeof S!=='object'){
  S=defaults();
  try{var o=JSON.parse(localStorage.getItem(OLD)||'null');if(o&&typeof o==='object'){if(o.me)S.me=o.me;if(o.ta)S.ta=o.ta;if(o.theme)S.theme=o.theme;if(Array.isArray(o.cards))S.cards=o.cards;if(Array.isArray(o.days))S.days=o.days;if(Array.isArray(o.lib)&&o.lib.length)S.lib=o.lib}}catch(e){}
}
var D0=defaults();
if(!S.me)S.me=D0.me;if(!S.ta)S.ta=D0.ta;
if(!Array.isArray(S.cards))S.cards=[];if(!Array.isArray(S.days))S.days=[];
if(!Array.isArray(S.moments))S.moments=[];if(!Array.isArray(S.mails))S.mails=[];if(!Array.isArray(S.draws))S.draws=[];
if(!Array.isArray(S.lib)||!S.lib.length)S.lib=LIB_DEFAULT.slice();

function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function fmt(t){var d=new Date(t);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDay(t){var d=new Date(t);return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function tiltOf(id){var h=0;for(var i=0;i<id.length;i++){h=(h+id.charCodeAt(i)*7)%11}return((h-5)*0.28).toFixed(2)+'deg'}
function dayDiff(str){var now=new Date();now.setHours(0,0,0,0);var p=String(str).split('-');var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));if(isNaN(d.getTime()))return null;return Math.round((now-d)/86400000)}
function nearDay(){var best=null,bestAbs=null,pick=null;for(var i=0;i<S.days.length;i++){var n=dayDiff(S.days[i].date);if(n===null)continue;var a=Math.abs(n);if(bestAbs===null||a<bestAbs){bestAbs=a;best=n;pick=S.days[i]}}return pick?{item:pick,n:best}:null}

function renderHome(){

  document.getElementById('qText').textContent=pool.length?pool[seed%pool.length].text:'写一句吧。';

function renderChat(){
  stream.innerHTML='';

    var e=document.createElement('div');e.className='empty';

    stream.appendChild(e);
  }else{
    for(var i=0;i<S.cards.length;i++)stream.appendChild(cardEl(S.cards[i]));
  }
  requestAnimationFrame(function(){stream.scrollTop=stream.scrollHeight});

function cardEl(c){
  var who=c.from==='me'?S.me:S.ta;
  var el=document.createElement('article');
  el.className='card '+(c.from==='me'?'me':'ta');
  el.style.setProperty('--tilt',tiltOf(c.id));
  var head=document.createElement('div');head.className='head';
  var n=document.createElement('span');n.className='n';n.textContent=who.name||'';
  var t=document.createElement('span');t.textContent=fmt(c.at);
  head.appendChild(n);head.appendChild(t);
  var body=document.createElement('p');body.className='body';body.textContent=c.text;
  var seal=document.createElement('div');seal.className='seal';seal.textContent=(who.name||'他').slice(-1);
  var del=document.createElement('button');del.className='del';del.textContent='撕掉';
  del.addEventListener('click',function(ev){
    ev.stopPropagation();
    if(confirm('撕掉这张？')){S.cards=S.cards.filter(function(x){return x.id!==c.id});save();renderChat()}
  });
  el.appendChild(head);el.appendChild(body);el.appendChild(seal);el.appendChild(del);
  el.addEventListener('click',function(ev){
    if(ev.target===del)return;
    var all=stream.querySelectorAll('.card.show-del');
    for(var i=0;i<all.length;i++)if(all[i]!==el)all[i].classList.remove('show-del');
    el.classList.toggle('show-del');
  });
  return el;
}

  var box=document.getElementById('drawList');
  if(!S.draws.length){box.innerHTML='<p class="hint">还没有抽过。</p>';return}
  box.innerHTML=S.draws.slice(0,8).map(function(x){
    return '<div class="dr"><b>'+esc(x.name)+(x.rev?' · 逆':' · 正')+'</b><span>'+fmtDay(x.at)+'</span></div>';
  }).join('');
}
function draw(){
  var card=document.getElementById('tcard');
  var front=document.getElementById('tfront');
  var btn=document.getElementById('btnDraw');
  if(flipped){
    flipped=false;card.classList.remove('flipped');
    btn.textContent='再 抽 一 张';
    setTimeout(doDraw,300);
    return;
  }
  doDraw();
  function doDraw(){
    btn.disabled=true;
    card.classList.add('shake');
    setTimeout(function(){
      card.classList.remove('shake');
      var c=TAROT[Math.floor(Math.random()*TAROT.length)];
      var rev=Math.random()<0.34;
      front.querySelector('.sym').textContent=c.s;
      front.querySelector('.nm').textContent=c.n;
      front.querySelector('.en').textContent=c.e;
      front.querySelector('.rev').textContent=rev?'逆 位':'正 位';
      card.classList.add('flipped');flipped=true;
      document.getElementById('tiName').textContent=c.n+' · '+(rev?'逆位':'正位');
      document.getElementById('tiMean').textContent=rev?c.rev:c.up;
      btn.disabled=false;btn.textContent='再 抽 一 张';
      S.draws.unshift({id:uid(),name:c.n,rev:rev,at:Date.now()});
      if(S.draws.length>40)S.draws.length=40;
      save();renderDraws();
    },620);
  }
}
function openSheet(title,node){
  sheetTitle.textContent=title;sheetBody.innerHTML='';sheetBody.appendChild(node);sheet.hidden=false;
}
function closeSheet(){sheet.hidden=true}
document.getElementById('sheetX').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
function openLib(){
  var wrap=document.createElement('div');
  var tags=document.createElement('div');tags.className='lib-tags';
  var list=document.createElement('div');
  var active='全部';
  function drawLib(){
    tags.innerHTML='';
    var all=['全部'],seen={};
    S.lib.forEach(function(x){if(!seen[x.tag]){seen[x.tag]=1;all.push(x.tag)}});
    all.forEach(function(tag){
      var b=document.createElement('button');
      b.className='lt'+(tag===active?' on':'');b.textContent=tag;
      b.addEventListener('click',function(){active=tag;drawLib()});
      tags.appendChild(b);
    });
    list.innerHTML='';
    var items=S.lib.filter(function(x){return active==='全部'||x.tag===active});
    if(!items.length){var p=document.createElement('p');p.className='hint';p.textContent='这一类还没有句子。直接写就好。';list.appendChild(p)}
    items.forEach(function(x){
      var row=document.createElement('div');row.className='librow';
      var b=document.createElement('button');b.className='li';b.textContent=x.text;
      b.addEventListener('click',function(){
        input.value=x.text;input.focus();input.style.height='auto';
        input.style.height=Math.min(input.scrollHeight,120)+'px';closeSheet();
      });
      var rm=document.createElement('button');rm.className='rm';rm.textContent='×';
      rm.addEventListener('click',function(ev){ev.stopPropagation();S.lib=S.lib.filter(function(y){return y!==x});save();drawLib()});
      row.appendChild(b);row.appendChild(rm);list.appendChild(row);
    });
  }
  drawLib();
  wrap.appendChild(tags);wrap.appendChild(list);
  var adder=document.createElement('div');adder.className='two';adder.style.marginTop='12px';
  adder.innerHTML='<div class="field" style="flex:2"><label>加一句自己的</label><input id="newLibText" maxlength="60" placeholder="写一句"></div><div class="field" style="flex:1"><label>归类</label><input id="newLibTag" maxlength="6" placeholder="我的"></div>';
  wrap.appendChild(adder);
  var addBtn=document.createElement('button');addBtn.className='ghost';addBtn.textContent='＋ 收进字卡库';
  addBtn.addEventListener('click',function(){
    var t=wrap.querySelector('#newLibText').value.trim();
    var g=wrap.querySelector('#newLibTag').value.trim()||'我的';
    if(!t)return;
    S.lib.push({tag:g,text:t});save();drawLib();wrap.querySelector('#newLibText').value='';
  });
  wrap.appendChild(addBtn);
  var h=document.createElement('p');h.className='hint';h.textContent='点一句填进输入框，可以再改。× 是把这句从库里删掉。';
  wrap.appendChild(h);
  openSheet('字卡库',wrap);
}
function openSettings(){
  var wrap=document.createElement('div');
  var f1=document.createElement('div');f1.className='two';
  f1.innerHTML='<div class="field"><label>我的名字</label><input id="inMeName" maxlength="12"></div><div class="field"><label>头像（一个字/符号）</label><input id="inMeAv" maxlength="4"></div>';
  wrap.appendChild(f1);
  var f2=document.createElement('div');f2.className='two';
  f2.innerHTML='<div class="field"><label>他的名字</label><input id="inTaName" maxlength="12"></div><div class="field"><label>头像</label><input id="inTaAv" maxlength="4"></div>';
  wrap.appendChild(f2);
  var label=document.createElement('div');label.className='field';label.innerHTML='<label>纸色</label>';
  var sw=document.createElement('div');sw.className='swatches';
  var themes=[{id:'paper',c:'#efe4d4',dot:'#b07b62'},{id:'night',c:'#17161c',dot:'#c99c8b'},{id:'rose',c:'#f6e3e3',dot:'#b96f74'},{id:'sage',c:'#e4e9df',dot:'#6f8a6d'}];
  themes.forEach(function(t){
    var b=document.createElement('button');
    b.className='sw'+(S.theme===t.id?' on':'');b.style.background=t.c;
    var i=document.createElement('i');i.style.background=t.dot;b.appendChild(i);
    b.addEventListener('click',function(){
      S.theme=t.id;applyTheme();save();
      var all=sw.querySelectorAll('.sw');
      for(var k=0;k<all.length;k++)all[k].classList.remove('on');
      b.classList.add('on');
    });
    sw.appendChild(b);
  });
  label.appendChild(sw);wrap.appendChild(label);
  var btn=document.createElement('button');btn.className='primary';btn.textContent='收 好';btn.style.width='100%';
  btn.addEventListener('click',function(){
    S.me.name=(wrap.querySelector('#inMeName').value||'我').trim().slice(0,12);
    S.me.avatar=(wrap.querySelector('#inMeAv').value||'🌙').trim().slice(0,4);
    S.ta.name=(wrap.querySelector('#inTaName').value||'他').trim().slice(0,12);
    S.ta.avatar=(wrap.querySelector('#inTaAv').value||'✦').trim().slice(0,4);
    save();paintNames();renderHome();renderChat();closeSheet();
  });
  wrap.appendChild(btn);
  var dayBtn=document.createElement('button');dayBtn.className='ghost';dayBtn.style.marginTop='10px';dayBtn.textContent='纪念日';
  dayBtn.addEventListener('click',function(){closeSheet();setTimeout(openDays,80)});
  wrap.appendChild(dayBtn);
  var menu=document.createElement('div');menu.className='menu-list';menu.style.marginTop='16px';
  menu.innerHTML='<button class="mi" data-s="export"><span>导出备份</span><span>json</span></button><button class="mi" data-s="import"><span>导入备份</span><span></span></button><button class="mi" data-s="clear"><span>全部清空</span><span></span></button>';
  wrap.appendChild(menu);
  menu.addEventListener('click',function(e){
    var b=e.target.closest('[data-s]');if(!b)return;
    if(b.dataset.s==='export')exportData();
    if(b.dataset.s==='import')document.getElementById('fileIn').click();
    if(b.dataset.s==='clear'){
      if(confirm('清空所有字卡、动态、信件和抽牌记录？')){
        if(confirm('真的清？不能撤回。')){localStorage.removeItem(KEY);location.reload()}
      }
    }
  });
  wrap.querySelector('#inMeName').value=S.me.name;
  wrap.querySelector('#inMeAv').value=S.me.avatar;
  wrap.querySelector('#inTaName').value=S.ta.name;
  wrap.querySelector('#inTaAv').value=S.ta.avatar;
  openSheet('设置',wrap);
}
function openDays(){
  var wrap=document.createElement('div');
  var list=document.createElement('div');
  function drawDays(){
    list.innerHTML='';
    if(!S.days.length){var p=document.createElement('p');p.className='hint';p.textContent='还没有日子。加一个开始的那天，主页就会一直数着。';list.appendChild(p)}
    S.days.forEach(function(d){
      var row=document.createElement('div');row.className='day';
      var left=document.createElement('div');
      var n=dayDiff(d.date);
      left.innerHTML=esc(d.title)+'<span class="d">'+esc(d.date)+'</span>';
      var right=document.createElement('div');right.style.display='flex';right.style.alignItems='center';
      var t=document.createElement('span');t.className='t';
      t.textContent=n===null?'—':(n>=0?'第 '+(n+1)+' 天':'还有 '+(-n)+' 天');
      var x=document.createElement('button');x.textContent='删';
      x.addEventListener('click',function(){S.days=S.days.filter(function(y){return y.id!==d.id});save();drawDays();renderHome()});
      right.appendChild(t);right.appendChild(x);
      row.appendChild(left);row.appendChild(right);list.appendChild(row);
    });
  }
  var f=document.createElement('div');f.className='two';
  f.innerHTML='<div class="field" style="flex:1.4"><label>名字</label><input id="dTitle" maxlength="16" placeholder="在一起"></div><div class="field"><label>那天</label><input id="dDate" type="date"></div>';
  wrap.appendChild(f);
  var add=document.createElement('button');add.className='ghost';add.textContent='＋ 记一个日子';add.style.marginBottom='14px';
  add.addEventListener('click',function(){
    var t=wrap.querySelector('#dTitle').value.trim();
    var d=wrap.querySelector('#dDate').value;
    if(!t||!d){alert('名字和日期都填一下。');return}
    S.days.push({id:uid(),title:t,date:d});save();drawDays();renderHome();wrap.querySelector('#dTitle').value='';
  });
  wrap.appendChild(add);wrap.appendChild(list);drawDays();
  openSheet('纪念日',wrap);
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');var d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='字卡-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.getElementById('fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.cards))throw new Error('bad');
      if(!confirm('导入会覆盖现在的数据，确定？'))return;
      S=Object.assign(defaults(),d);
      save();applyTheme();paintNames();renderHome();renderChat();renderMoments();renderMail();renderDraws();
      alert('回来了。');
    }catch(err){alert('这个文件读不出来。')}
  };
  fr.readAsText(f);e.target.value='';
});
document.getElementById('btnSend').addEventListener('click',send);
document.getElementById('btnLib').addEventListener('click',openLib);
document.getElementById('btnSet').addEventListener('click',openSettings);
document.getElementById('btnDraw').addEventListener('click',draw);
document.getElementById('rClose').addEventListener('click',closeReader);
document.getElementById('rDel').addEventListener('click',function(){
  if(!currentMail)return;
  if(confirm('撕掉这封信？')){S.mails=S.mails.filter(function(x){return x.id!==currentMail.id});save();closeReader();renderMail()}
});
document.getElementById('rReply').addEventListener('click',function(){
  if(!currentMail)return;
  var from=currentMail.from==='me'?'ta':'me';
  var pre={from:from,title:'回：'+currentMail.title};
  closeReader();setTimeout(function(){newMail(pre)},120);
});
reader.addEventListener('click',function(e){if(e.target===reader)closeReader()});
document.getElementById('tabbar').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(b)go(b.dataset.view);
});
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.dataset.act,id=a.dataset.id;
  if(act==='settings')openSettings();
  if(act==='newMoment')newMoment();
  if(act==='newMail')newMail();
  if(act==='openMail')openMail(id);
  if(act==='delMo'){if(confirm('删掉这条动态？')){S.moments=S.moments.filter(function(x){return x.id!==id});save();renderMoments()}}
  if(act==='like'){
    var m=null;for(var i=0;i<S.moments.length;i++)if(S.moments[i].id===id)m=S.moments[i];
    if(!m)return;m.likes=m.likes||[];
    var k=m.likes.indexOf('me');if(k>=0)m.likes.splice(k,1);else m.likes.push('me');
    save();renderMoments();
  }
  if(act==='comment'){
    var t=prompt('说一句：');
    if(t&&t.trim()){
      var mm=null;for(var j=0;j<S.moments.length;j++)if(S.moments[j].id===id)mm=S.moments[j];
      if(!mm)return;mm.comments=mm.comments||[];
      mm.comments.push({id:uid(),from:'me',text:t.trim(),at:Date.now()});
      save();renderMoments();
    }
  }
});
var tabs2=document.querySelectorAll('.tab2');
for(var ti=0;ti<tabs2.length;ti++){
  (function(b){
    b.addEventListener('click',function(){
      S.from=b.dataset.from;
      for(var k=0;k<tabs2.length;k++)tabs2[k].classList.remove('on');
      b.classList.add('on');save();
      input.placeholder=S.from==='me'?'写一句，递过去…':'替他写一句…';
      input.focus();
    });
  })(tabs2[ti]);
}
input.addEventListener('input',function(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,120)+'px';
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
applyTheme();paintNames();
for(var q=0;q<tabs2.length;q++)tabs2[q].classList.toggle('on',tabs2[q].dataset.from===S.from);
input.placeholder=S.from==='me'?'写一句，递过去…':'替他写一句…';
go('home');renderChat();splash();
window.addEventListener('beforeunload',save);
})();
</script>
</body>
