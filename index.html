<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper" data-style="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4d4">
<title>字卡传讯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;--serif:"Songti SC","Noto Serif SC",ui-serif,Georgia,serif}
html[data-theme="paper"]{--bg-a:#f3e8d8;--bg-b:#e4d2bb;--ink:#3a322a;--sub:#94816d;--accent:#b07b62;--blob1:rgba(255,206,150,.9);--blob2:rgba(255,244,222,.9);--blob3:rgba(206,186,255,.45);--solid:#fdf7ec;--solid-2:#f5e8d6;--solid-3:#fbe7e3;--line-solid:rgba(90,70,50,.13)}
html[data-theme="night"]{--bg-a:#1b1a21;--bg-b:#0e0d12;--ink:#e8dfd2;--sub:#8b8174;--accent:#c99c8b;--blob1:rgba(92,70,130,.55);--blob2:rgba(130,70,86,.4);--blob3:rgba(38,60,96,.55);--solid:#232129;--solid-2:#1a1820;--solid-3:#2d2530;--line-solid:rgba(255,255,255,.1)}
html[data-theme="rose"]{--bg-a:#f7e5e5;--bg-b:#efd3d3;--ink:#42312f;--sub:#a5898a;--accent:#b96f74;--blob1:rgba(255,190,196,.85);--blob2:rgba(255,244,240,.9);--blob3:rgba(220,190,255,.4);--solid:#fff8f7;--solid-2:#f9e6e4;--solid-3:#fbdcdc;--line-solid:rgba(120,70,66,.13)}
html[data-theme="sage"]{--bg-a:#e6ebdf;--bg-b:#d3ddcb;--ink:#303a31;--sub:#7a887a;--accent:#6f8a6d;--blob1:rgba(190,220,180,.8);--blob2:rgba(246,252,238,.9);--blob3:rgba(180,210,230,.5);--solid:#fbfdf6;--solid-2:#eaf1e6;--solid-3:#e0ecdf;--line-solid:rgba(60,80,60,.14)}
html[data-style="glass"]{--surface:rgba(255,255,255,.44);--surface-2:rgba(255,255,255,.26);--surface-3:rgba(255,255,255,.16);--line:rgba(255,255,255,.55);--blur:saturate(170%) blur(20px);--shadow:0 12px 34px rgba(80,58,36,.12);--card-a:rgba(255,255,255,.5);--card-b:rgba(255,232,228,.46)}
html[data-theme="night"][data-style="glass"]{--surface:rgba(52,48,62,.55);--surface-2:rgba(38,35,46,.44);--surface-3:rgba(30,28,38,.36);--line:rgba(255,255,255,.13);--shadow:0 12px 34px rgba(0,0,0,.5);--card-a:rgba(52,48,62,.6);--card-b:rgba(62,48,58,.55)}
html[data-style="solid"]{--surface:var(--solid);--surface-2:var(--solid-2);--surface-3:var(--solid-2);--line:var(--line-solid);--blur:none;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(90,66,44,.07);--card-a:var(--solid);--card-b:var(--solid-3)}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);background:linear-gradient(165deg,var(--bg-a),var(--bg-b));font-family:var(--serif);-webkit-font-smoothing:antialiased;transition:background .5s,color .3s}
body::before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;background:radial-gradient(36% 28% at 18% 14%,var(--blob1),transparent 70%),radial-gradient(32% 26% at 84% 26%,var(--blob2),transparent 72%),radial-gradient(42% 30% at 52% 92%,var(--blob3),transparent 70%);filter:blur(34px);opacity:.85;transition:opacity .5s}
html[data-style="solid"] body::before{opacity:0}
html[data-style="solid"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.016) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 96px;display:none;scrollbar-width:none;animation:vin .3s ease}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,var(--bg-a),var(--bg-b));transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp{text-align:center;transform:translateY(-6vh)}
.sp-mark{font-size:58px;line-height:1;color:var(--accent);opacity:0;animation:markIn 1.2s cubic-bezier(.2,.8,.3,1) .1s forwards}
.sp-title{margin-top:14px;font-size:22px;letter-spacing:.44em;text-indent:.44em;opacity:0;animation:fadeUp .9s ease .5s forwards}
.sp-line{height:1px;background:var(--line);margin:18px auto 0;width:0;animation:lineIn 1s cubic-bezier(.3,.9,.3,1) .85s forwards}
.sp-sub{margin-top:14px;font-size:11px;letter-spacing:.3em;color:var(--sub);opacity:0;animation:fadeUp .9s ease 1.1s forwards}
@keyframes markIn{from{opacity:0;transform:scale(.7)}to{opacity:.92;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lineIn{to{width:120px}}
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:5px 0 3px;color:var(--sub);font-family:var(--sans);font-size:10px;letter-spacing:.1em;cursor:pointer;transition:color .2s}
.tab i{font-style:normal;font-size:17px;line-height:1.1;opacity:.85}
.tab.on{color:var(--accent)}
.tab.on i{opacity:1}
.ico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:var(--sans);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.ghost{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;cursor:pointer;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.primary{padding:9px 20px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-family:var(--sans);font-size:13.5px;letter-spacing:.12em;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.primary:active{transform:translateY(1px)}
.hint{font-family:var(--sans);font-size:11.5px;color:var(--sub);line-height:1.9;margin:10px 0 0}
.empty{font-family:var(--sans);text-align:center;color:var(--sub);font-size:13px;line-height:2.1;border:1px dashed var(--line);border-radius:16px;padding:28px 20px;margin:18px 0;background:var(--surface-3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.empty b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:400;margin-bottom:6px;letter-spacing:.08em}
.home-head{padding:26px 2px 6px}
.hh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hh-date{font-family:var(--sans);font-size:11px;color:var(--sub);letter-spacing:.16em}
.hh-acts{display:flex;gap:7px}
.hh-pair{display:flex;align-items:flex-start;justify-content:center;gap:22px;margin:24px 0 2px}
.hp{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.hp:active .hp-av{transform:scale(.96)}
.hp-wrap{position:relative;display:block}
.hp-av{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:32px;overflow:hidden;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .18s ease}
.hp-cam{position:absolute;right:-1px;bottom:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--sans);font-size:11px;display:grid;place-items:center;border:2px solid var(--solid);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.hp-nm{font-size:16px;letter-spacing:.12em}
.hp-link{color:var(--accent);opacity:.7;font-size:20px;line-height:80px}
.hp-av img,.av img,.mo-av img{width:100%;height:100%;object-fit:cover;display:block}
.hh-day{margin:12px 0 0;text-align:center;font-family:var(--sans);font-size:12px;color:var(--sub);letter-spacing:.14em}
.quote{margin:24px 0 20px;padding:20px 18px 16px;border-radius:18px;position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.quote::before{content:"“";position:absolute;left:10px;top:2px;font-size:36px;color:var(--accent);opacity:.25}
.quote p{margin:0;padding-left:16px;font-size:14.5px;line-height:2}
.quote span{display:block;margin-top:8px;padding-left:16px;font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.14em}
.entries{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.entry{text-align:left;padding:17px 15px;border-radius:16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:transform .18s ease}
.entry:active{transform:scale(.985)}
.entry b{font-size:15.5px;font-weight:400;letter-spacing:.1em}
.entry span{font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.entry em{position:absolute;right:13px;top:13px;font-style:normal;font-family:var(--sans);font-size:10.5px;color:var(--accent);opacity:.85}
.home-foot{margin-top:28px;text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.1em;opacity:.8}
#v-chat{padding:0}
.chat-top{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
.pair{display:flex;align-items:center;gap:8px;flex:1}
.who{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:2px;color:inherit;font:inherit;cursor:pointer}
.who:active{opacity:.6}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.nm{font-size:12.5px;letter-spacing:.06em}
.st{font-family:var(--sans);font-size:9.5px;color:var(--sub);letter-spacing:.08em}
.bond{color:var(--sub);font-size:14px;opacity:.7;padding-bottom:15px}
#stream{flex:1;overflow-y:auto;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#stream::-webkit-scrollbar{display:none}
#v-chat.on{display:flex;flex-direction:column;padding-bottom:0}
.card{position:relative;max-width:84%;padding:13px 15px 28px;border-radius:14px;background:var(--card-a);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transform:rotate(var(--tilt,0deg));transition:transform .28s ease,box-shadow .28s ease;animation:pop .36s cubic-bezier(.2,.8,.3,1) both}
.card.me{align-self:flex-end;background:var(--card-b);border-bottom-right-radius:5px}
.card.ta{align-self:flex-start;border-bottom-left-radius:5px}
.card:hover{transform:rotate(0)}
@keyframes pop{from{opacity:0;transform:translateY(9px) rotate(var(--tilt,0deg)) scale(.985)}}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.05em}
.head .n{color:var(--accent);letter-spacing:.1em}
.body{margin:0;font-size:15.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;letter-spacing:.02em}
.seal{position:absolute;right:11px;bottom:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--sans);font-size:10.5px;color:var(--accent);opacity:.4;transform:rotate(-9deg);pointer-events:none}
.del{position:absolute;left:10px;bottom:5px;border:0;background:none;padding:3px;font-family:var(--sans);font-size:10.5px;color:var(--sub);cursor:pointer;opacity:0;transition:opacity .2s}
.card.show-del .del{opacity:.85}
.chat-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:0 0 auto;background:var(--surface-3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab2{flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;cursor:pointer;transition:.2s}
.tab2.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:46px;max-height:120px;resize:none;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.7;outline:none;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--sub);opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.row .left{display:flex;gap:7px}
.mo-cover{margin:0 -16px;height:150px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card-b),var(--surface));border-bottom:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.mo-cover .cname{position:absolute;left:20px;bottom:16px;font-size:20px;letter-spacing:.14em}
.mo-cover .cdot{position:absolute;right:18px;bottom:16px;font-family:var(--sans);font-size:10px;color:var(--sub);letter-spacing:.14em}
.mo-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
.mo-bar h3{margin:0;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.2em;color:var(--sub)}
.mo{display:flex;gap:11px;padding:16px 2px;border-bottom:1px solid var(--line)}
.mo-av{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;overflow:hidden;background:var(--surface);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.mo-main{flex:1;min-width:0}
.mo-name{font-family:var(--sans);font-size:12.5px;color:var(--accent);letter-spacing:.08em}
.mo-text{margin:6px 0 0;font-size:14.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.mo-img{margin-top:9px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:34px;background:linear-gradient(140deg,var(--card-b),var(--surface));border:1px solid var(--line)}
.mo-meta{display:flex;gap:14px;align-items:center;margin-top:9px;font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.06em;flex-wrap:wrap}
.mo-meta button{border:0;background:none;font-family:var(--sans);font-size:10.5px;color:var(--sub);cursor:pointer;padding:2px 0;letter-spacing:.06em}
.mo-meta button.liked{color:var(--accent)}
.mo-cmts{margin-top:9px;padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--sans);font-size:12.5px;line-height:1.85}
.mo-cmts div{color:var(--ink);word-break:break-word}
.mo-cmts b{font-weight:400;color:var(--accent);margin-right:6px}
.mo-cbox{display:flex;gap:6px;margin-top:9px}
.mo-cbox input{flex:1;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:12.5px;outline:none}
.mo-cbox button{padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:12px;cursor:pointer}
.mo-cbox button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mail{position:relative;margin:14px 0;padding:16px 17px;border-radius:16px;cursor:pointer;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);animation:pop .3s ease both}
.mail-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mail-title{font-size:15px;letter-spacing:.06em}
.mail-date{font-family:var(--sans);font-size:10.5px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
.mail-from{margin-top:6px;font-family:var(--sans);font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.mail-prev{margin:7px 0 0;font-size:12.5px;color:var(--sub);line-height:1.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mail.unread::after{content:"";position:absolute;right:15px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.reader{position:fixed;inset:0;z-index:60;background:rgba(20,14,10,.42);display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease}
.reader[hidden]{display:none!important}
@keyframes fade{from{opacity:0}}
.letter{width:100%;max-width:430px;max-height:82dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3);padding:24px 20px 18px;position:relative;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);animation:up .32s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:.6}}
.letter::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;background:repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px);opacity:.4}
.letter-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;position:relative}
.letter-head h3{margin:0;font-size:17px;font-weight:400;letter-spacing:.08em}
.letter-body{position:relative;margin:16px 0 0;flex:1;overflow-y:auto;font-size:15px;line-height:32px;white-space:pre-wrap;word-break:break-word}
.letter-foot{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.letter-foot .from{font-family:var(--sans);font-size:11.5px;color:var(--accent);letter-spacing:.12em}
.letter-foot .acts{display:flex;gap:8px}
.tarot-stage{height:276px;display:grid;place-items:center;perspective:1200px;margin-top:10px}
.tcard{width:158px;height:238px;position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.tcard.flipped{transform:rotateY(180deg)}
.tcard.shake{animation:shk .5s ease}
@keyframes shk{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-3deg) translateX(-6px)}75%{transform:rotate(3deg) translateX(6px)}}
.tface{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 38px rgba(0,0,0,.18);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tback{background:linear-gradient(150deg,var(--card-b),var(--surface));color:var(--accent);font-size:36px}
.tback::after{content:"";position:absolute;inset:10px;border:1px solid var(--accent);opacity:.22;border-radius:10px}
.tfront{background:var(--surface);transform:rotateY(180deg);padding:14px;text-align:center}
.tfront .sym{font-size:48px;line-height:1}
.tfront .nm{font-size:15px;letter-spacing:.14em;color:var(--accent)}
.tfront .en{font-family:var(--sans);font-size:9.5px;color:var(--sub);letter-spacing:.12em}
.tfront .rev{font-family:var(--sans);font-size:10px;color:var(--sub);letter-spacing:.2em}
.tarot-info{margin-top:6px;min-height:96px;text-align:center}
.tarot-info .ti-name{font-size:16px;letter-spacing:.12em}
.tarot-info .ti-mean{margin:9px auto 0;max-width:330px;font-size:13px;line-height:2;color:var(--sub)}
.tarot-acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.draws{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.draws h4{margin:0 0 8px;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--sub);letter-spacing:.18em}
.dr{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--sub);padding:6px 0}
.dr b{font-weight:400;color:var(--ink);letter-spacing:.06em}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,14,10,.38);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease}
.sheet[hidden]{display:none!important}
.inner{width:100%;max-width:520px;max-height:82dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);animation:up2 .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up2{from{transform:translateY(24px);opacity:.5}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:15px;font-weight:400;letter-spacing:.12em}
.x{border:0;background:none;color:var(--sub);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--sans);font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:14px;outline:none}
.field textarea{min-height:120px;line-height:1.8;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.two{display:flex;gap:10px}
.two .field{flex:1}
.swatches{display:flex;gap:12px;margin:4px 0 14px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;padding:0}
.sw.on{border-color:var(--accent)}
.sw i{position:absolute;inset:6px;border-radius:50%;display:block}
.seg{display:flex;gap:8px;margin:4px 0 16px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menu-list{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-family:var(--sans);font-size:14px;text-align:left;cursor:pointer}
.mi:last-child{border-bottom:0}
.mi span{color:var(--sub);font-size:11.5px}
.lib-search{display:flex;gap:8px;margin-bottom:10px}
.lib-search input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:13px;outline:none}
.lib-search button{padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:12.5px;cursor:pointer;white-space:nowrap}
.lib-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.lt{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:12px;cursor:pointer}
.lt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.librow{position:relative}
.librow .li{padding-right:40px}
.librow .rm{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:17px;line-height:1;cursor:pointer;padding:8px}
.li{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--serif);font-size:14px;line-height:1.8;cursor:pointer}
.day{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13.5px}
.day .t{color:var(--accent);font-size:11px;letter-spacing:.06em;white-space:nowrap}
.day .d{color:var(--sub);font-size:11px;margin-left:8px}
.day button{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;padding:4px}
.pick{display:flex;gap:8px;margin-bottom:12px}
.pick button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:13px;cursor:pointer}
.pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.presets button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-family:var(--sans);font-size:11.5px;cursor:pointer}

        <div class="tabs"><button class="tab2 on" data-from="me">我 说</button><button class="tab2" data-from="ta" id="tabTa">顾时夜 说</button></div>

        <div class="row"><div class="left"><button class="ghost" id="btnLib">字卡库</button><button class="ghost" id="btnBubble">气泡</button></div><button class="primary" id="btnSend">递 出 去</button></div>
      </div>
    </section>
    <section class="view" data-view="moments">
      <div class="mo-cover"><span class="cname" id="moCoverName">朋友圈</span><span class="cdot" id="moCount"></span></div>
      <div class="mo-bar"><h3>动 态</h3><button class="ghost" data-act="newMoment">＋ 发一条</button></div>
      <div id="moList"></div>
    </section>
    <section class="view" data-view="mail">
      <div class="mo-bar" style="padding-top:24px"><h3>信 箱</h3><button class="ghost" data-act="newMail">＋ 写一封信</button></div>
      <div id="mailList"></div>
    </section>
    <section class="view" data-view="tarot">
      <div class="mo-bar" style="padding-top:24px"><h3>塔 罗</h3><span class="hh-date" id="tarotDate"></span></div>
      <div class="tarot-stage"><div class="tcard" id="tcard"><div class="tface tback">✧</div><div class="tface tfront" id="tfront"><span class="sym">✧</span><span class="nm">—</span><span class="en">—</span><span class="rev">—</span></div></div></div>
      <div class="tarot-info"><div class="ti-name" id="tiName">问一句，然后抽一张</div><p class="ti-mean" id="tiMean">心里先想一件事。不用说出来。</p></div>
      <div class="tarot-acts"><button class="primary" id="btnDraw">抽 一 张</button></div>
      <div class="draws"><h4>抽 过 的</h4><div id="drawList"></div></div>
    </section>
  </div>
  <nav id="tabbar">
    <button class="tab on" data-view="home"><i>⌂</i>主页</button>
    <button class="tab" data-view="chat"><i>▤</i>传讯</button>
    <button class="tab" data-view="moments"><i>◍</i>朋友圈</button>
    <button class="tab" data-view="mail"><i>✉</i>回信</button>
    <button class="tab" data-view="tarot"><i>✦</i>塔罗</button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden><div class="inner"><div class="sh"><h2 id="sheetTitle"></h2><button class="x" id="sheetX">×</button></div><div id="sheetBody"></div></div></div>
<div class="reader" id="reader" hidden><div class="letter"><div class="letter-head"><h3 id="rTitle"></h3><button class="x" id="rClose">×</button></div><div class="letter-body" id="rBody"></div><div class="letter-foot"><span class="from" id="rFrom"></span><div class="acts"><button class="ghost" id="rReply">回一封</button><button class="ghost" id="rDel">撕掉</button></div></div></div></div>

function defaults(){return{me:{name:'江月棠',avatar:'🌙',img:''},ta:{name:TA_NAME,avatar:'✦',img:''},theme:'paper',style:'glass',cards:[],days:[],lib:LIB_DEFAULT.slice(),moments:[],mails:[],draws:[],from:'me',bubbleCSS:''}}
var S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||typeof S!=='object')S=defaults();
var D0=defaults();
if(!S.me)S.me=D0.me;if(!S.ta)S.ta=D0.ta;
if(!S.ta.name||S.ta.name==='他')S.ta.name=TA_NAME;
if(typeof S.me.img!=='string')S.me.img='';if(typeof S.ta.img!=='string')S.ta.img='';
if(!Array.isArray(S.cards))S.cards=[];if(!Array.isArray(S.days))S.days=[];
if(!Array.isArray(S.moments))S.moments=[];if(!Array.isArray(S.mails))S.mails=[];if(!Array.isArray(S.draws))S.draws=[];
if(!Array.isArray(S.lib)||!S.lib.length)S.lib=LIB_DEFAULT.slice();
if(!S.theme)S.theme='paper';if(!S.from)S.from='me';
if(!S.style)S.style='glass';
if(typeof S.bubbleCSS!=='string')S.bubbleCSS='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
save();
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function fmt(t){var d=new Date(t);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDay(t){var d=new Date(t);return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function tiltOf(id){var h=0;for(var i=0;i<id.length;i++){h=(h+id.charCodeAt(i)*7)%11}return((h-5)*0.28).toFixed(2)+'deg'}
function dayDiff(str){var now=new Date();now.setHours(0,0,0,0);var p=String(str).split('-');var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));if(isNaN(d.getTime()))return null;return Math.round((now-d)/86400000)}
function nearDay(){var best=null,bestAbs=null,pick=null;for(var i=0;i<S.days.length;i++){var n=dayDiff(S.days[i].date);if(n===null)continue;var a=Math.abs(n);if(bestAbs===null||a<bestAbs){bestAbs=a;best=n;pick=S.days[i]}}return pick?{item:pick,n:best}:null}

function pickAvatar(k){
  pickFor=k;

document.getElementById('avIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  var k=pickFor;
  if(!f||!k)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var size=320,c=document.createElement('canvas');
      c.width=size;c.height=size;
      var s=Math.min(img.width,img.height);
      var sx=(img.width-s)/2,sy=(img.height-s)/2;
      c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,size,size);
      var old=S[k].img;
      S[k].img=c.toDataURL('image/jpeg',0.86);
      if(!save()){S[k].img=old;alert('这张存不下，换一张试试。');return}
      paintNames();renderMoments();
    };
    img.onerror=function(){alert('这张读不出来，换一张试试。')};
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
});
function go(v){

  for(var i=0;i<views.length;i++)views[i].classList.toggle('on',views[i].dataset.view===v);

function draw(){
  var card=document.getElementById('tcard');
  var front=document.getElementById('tfront');
  var btn=document.getElementById('btnDraw');
  if(flipped){
    flipped=false;card.classList.remove('flipped');
    btn.textContent='再 抽 一 张';
    setTimeout(doDraw,320);
    return;
  }
  doDraw();
  function doDraw(){
    btn.disabled=true;
    card.classList.add('shake');
    setTimeout(function(){
      card.classList.remove('shake');
      var c=TAROT[Math.floor(Math.random()*TAROT.length)];
      var rev=Math.random()<0.34;
      front.querySelector('.sym').textContent=c.s;
      front.querySelector('.nm').textContent=c.n;
      front.querySelector('.en').textContent=c.e;
      front.querySelector('.rev').textContent=rev?'逆 位':'正 位';
      card.classList.add('flipped');flipped=true;
      document.getElementById('tiName').textContent=c.n+' · '+(rev?'逆位':'正位');
      document.getElementById('tiMean').textContent=rev?c.rev:c.up;
      btn.disabled=false;btn.textContent='再 抽 一 张';
      S.draws.unshift({id:uid(),name:c.n,rev:rev,at:Date.now()});
      if(S.draws.length>40)S.draws.length=40;
      save();renderDraws();
    },640);
  }
}

function openLib(){
  var wrap=document.createElement('div');

  var active='全部',q='';
  function drawLib(){
    tags.innerHTML='';
    var all=['全部'],seen={};
    S.lib.forEach(function(x){if(!seen[x.tag]){seen[x.tag]=1;all.push(x.tag)}});
    all.forEach(function(tag){
      var b=document.createElement('button');
      b.className='lt'+(tag===active?' on':'');b.textContent=tag;
      b.addEventListener('click',function(){active=tag;drawLib()});
      tags.appendChild(b);
    });
    list.innerHTML='';
    var items=S.lib.filter(function(x){
      if(active!=='全部'&&x.tag!==active)return false;
      if(q&&x.text.toLowerCase().indexOf(q.toLowerCase())<0)return false;
      return true;
    });
    if(!items.length){var p=document.createElement('p');p.className='hint';p.textContent='没找到。换个词，或者直接写。';list.appendChild(p)}

      });

      row.appendChild(b);row.appendChild(rm);list.appendChild(row);
    });
  }
  drawLib();
  wrap.appendChild(searchRow);wrap.appendChild(tags);wrap.appendChild(list);
  searchRow.querySelector('#libQ').addEventListener('input',function(){q=this.value.trim();drawLib()});
  searchRow.querySelector('#libRand').addEventListener('click',function(){
    var items=S.lib.filter(function(x){return (active==='全部'||x.tag===active)&&(!q||x.text.indexOf(q)>=0)});
    if(!items.length)return;
    var pick=items[Math.floor(Math.random()*items.length)];
    input.value=pick.text;input.focus();closeSheet();
  });

  wrap.appendChild(adder);

    adder.querySelector('#newLibText').value='';

    var t=wrap.querySelector('#dTitle').value.trim();
    var d=wrap.querySelector('#dDate').value;
    if(!t||!d){alert('名字和日期都填一下。');return}
    S.days.push({id:uid(),title:t,date:d});save();drawDays();renderHome();wrap.querySelector('#dTitle').value='';
  });
  wrap.appendChild(add);wrap.appendChild(list);drawDays();
  openSheet('纪念日',wrap);
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');var d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='字卡-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.getElementById('fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.cards))throw new Error('bad');
      if(!confirm('导入会覆盖现在的数据，确定？'))return;
      S=Object.assign(defaults(),d);
      save();applySkin();applyBubbleCSS();paintNames();renderHome();renderChat();renderMoments();renderMail();renderDraws();
      alert('回来了。');
    }catch(err){alert('这个文件读不出来。')}
  };
  fr.readAsText(f);e.target.value='';
});
document.getElementById('btnSend').addEventListener('click',send);
document.getElementById('btnLib').addEventListener('click',openLib);
document.getElementById('btnBubble').addEventListener('click',openBubble);
document.getElementById('btnSet').addEventListener('click',openSettings);
document.getElementById('btnStyle').addEventListener('click',function(){
  S.style=S.style==='glass'?'solid':'glass';
  applySkin();save();
  this.textContent=S.style==='glass'?'◐':'◼';
});
document.getElementById('btnDraw').addEventListener('click',draw);
document.getElementById('rClose').addEventListener('click',closeReader);
document.getElementById('rDel').addEventListener('click',function(){
  if(!currentMail)return;
  if(confirm('撕掉这封信？')){S.mails=S.mails.filter(function(x){return x.id!==currentMail.id});save();closeReader();renderMail()}
});
document.getElementById('rReply').addEventListener('click',function(){
  if(!currentMail)return;
  var from=currentMail.from==='me'?'ta':'me';
  var pre={from:from,title:'回：'+currentMail.title};
  closeReader();setTimeout(function(){newMail(pre)},120);
});
reader.addEventListener('click',function(e){if(e.target===reader)closeReader()});
document.getElementById('tabbar').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(b)go(b.dataset.view);
});
document.addEventListener('click',function(e){
  var pk=e.target.closest('[data-pick]');if(pk){pickAvatar(pk.dataset.pick);return}
  var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.dataset.act,id=a.dataset.id;
  if(act==='settings')openSettings();
  if(act==='newMoment')newMoment();
  if(act==='newMail')newMail();
  if(act==='openMail')openMail(id);
  if(act==='delMo'){if(confirm('删掉这条动态？')){S.moments=S.moments.filter(function(x){return x.id!==id});save();renderMoments()}}
  if(act==='like'){
    var m=null;for(var i=0;i<S.moments.length;i++)if(S.moments[i].id===id)m=S.moments[i];
    if(!m)return;m.likes=m.likes||[];
    var k=m.likes.indexOf('me');if(k>=0)m.likes.splice(k,1);else m.likes.push('me');
    save();renderMoments();
  }
  if(act==='comment'){
    var mo=null;for(var j=0;j<S.moments.length;j++)if(S.moments[j].id===id)mo=S.moments[j];
    if(!mo)return;
    var art=document.querySelector('[data-mo="'+id+'"]');
    if(!art)return;
    var old=art.querySelector('.mo-cbox');
    if(old){old.remove();return}
    var box=document.createElement('div');box.className='mo-cbox';
    box.innerHTML='<button data-who="me" class="on">'+esc(S.me.name)+'</button><button data-who="ta">'+esc(S.ta.name)+'</button><input placeholder="说一句…"><button data-send="1">发</button>';
    art.querySelector('.mo-main').appendChild(box);
    var who='me';
    box.addEventListener('click',function(ev){
      var b=ev.target.closest('button');if(!b)return;
      if(b.dataset.who){
        who=b.dataset.who;
        box.querySelectorAll('[data-who]').forEach(function(x){x.classList.toggle('on',x===b)});
      }
      if(b.dataset.send){
        var val=box.querySelector('input').value.trim();
        if(!val)return;
        mo.comments=mo.comments||[];
        mo.comments.push({id:uid(),from:who,text:val,at:Date.now()});
        save();renderMoments();
      }
    });
    box.querySelector('input').focus();
  }
});
var tabs2=document.querySelectorAll('.tab2');
for(var ti=0;ti<tabs2.length;ti++){
  (function(b){
    b.addEventListener('click',function(){
      S.from=b.dataset.from;
      for(var k=0;k<tabs2.length;k++)tabs2[k].classList.remove('on');
      b.classList.add('on');save();
      input.placeholder=S.from==='me'?'写一句，递过去…':'替'+taName()+'写一句…';
      input.focus();
    });
  })(tabs2[ti]);
}
input.addEventListener('input',function(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,120)+'px';
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
applySkin();applyBubbleCSS();paintNames();
document.getElementById('btnStyle').textContent=S.style==='glass'?'◐':'◼';
for(var q=0;q<tabs2.length;q++)tabs2[q].classList.toggle('on',tabs2[q].dataset.from===S.from);
go('home');renderChat();splash();
window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
