<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf6f4">
<title>江亭晚 · 开屏预览</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
/* 开屏预览：灯笼垂下来轻轻晃，花枝随风摆，远山薄雾慢慢飘，名字一个字一个字晕出来，花瓣一直落。
   素材读 raw/ 原图，打开时在手机上把白底算成真透明；算不出来就退回 multiply 叠底 */
:root{--bg-a:#fdf6f4;--bg-b:#f6e3e6;--ink:#7a4652;--sub:#b48a92;--petal:#f3b3c0;--seal:#c4565f;--tone:none}
html[data-tone="zi"]{--bg-a:#f9f5fc;--bg-b:#ebe1f4;--ink:#5c4870;--sub:#9b88b0;--petal:#d6bdf0;--seal:#8a5fb0;--tone:hue-rotate(-50deg) saturate(.92)}
html[data-tone="su"]{--bg-a:#f7f6f3;--bg-b:#e8e6e1;--ink:#45464a;--sub:#8c8a86;--petal:#e4d8d8;--seal:#a2463f;--tone:grayscale(.85) contrast(1.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(172deg,var(--bg-a) 0%,var(--bg-b) 100%);color:var(--ink);font-family:"LXGW WenKai","Kaiti SC","STKaiti",serif;-webkit-tap-highlight-color:transparent;transition:background .6s}
#sp{position:fixed;inset:0;cursor:pointer;transition:opacity .6s ease,transform .6s ease}
#sp.out{opacity:0;transform:scale(1.04)}
.art{position:absolute;display:block;mix-blend-mode:multiply;filter:var(--tone);pointer-events:none;user-select:none;-webkit-user-drag:none;transition:filter .6s,opacity .4s}
.art.keyed{mix-blend-mode:normal}
.mist{left:-12%;bottom:-4%;width:130%;opacity:.5;animation:fade 2.6s ease both,drift 28s ease-in-out 2.6s infinite alternate}
.br{top:-10%;left:-30%;width:84%;max-width:470px;opacity:.92;transform-origin:50% 0;transform:scaleX(-1) rotate(6deg);-webkit-mask-image:linear-gradient(170deg,#000 30%,transparent 62%);mask-image:linear-gradient(170deg,#000 30%,transparent 62%);animation:fade 2.2s ease .2s both,bsway 9s ease-in-out 2.4s infinite}
.lan{top:-6%;right:-20%;width:98%;max-width:580px;transform-origin:70% 0;animation:drop 1.7s cubic-bezier(.2,.8,.3,1) both,sway 7s ease-in-out 1.7s infinite}
.nm{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:grid;grid-template-columns:64px 30px 64px;justify-items:center;align-items:start}
.nm b,.nm i{display:flex;flex-direction:column;align-items:center;font-style:normal}
.nm b{font-weight:400;font-size:50px;line-height:1;gap:8px;color:var(--ink);text-shadow:0 2px 14px rgba(255,255,255,.9)}
.nm b span{display:block;animation:ink 1.3s ease both}
.nm b.me{grid-column:3;grid-row:1}
.nm b.ta{grid-column:1;grid-row:1;margin-top:58px}
.nm i{grid-column:2;grid-row:1;font-size:12px;line-height:1;gap:9px;color:var(--sub);margin-top:24px;animation:fade 1.6s ease 1.6s both}
.nm i span{display:block}
.seal{position:absolute;left:-30px;bottom:-34px;width:26px;height:26px;border:1.5px solid var(--seal);border-radius:3px;color:var(--seal);font-size:17px;line-height:23px;text-align:center;opacity:.85;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) 3s both}
.ft{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;animation:fade 2s ease 2.4s both}
.ft p{font-size:14px;letter-spacing:.4em;color:var(--sub);padding-left:.4em}
.ft em{display:block;margin-top:14px;font-style:normal;font-size:12px;letter-spacing:.6em;color:var(--sub);opacity:.75;padding-left:.6em;animation:breath 2.6s ease-in-out infinite}
.pt{position:absolute;top:-6%;width:12px;height:9px;border-radius:80% 0 80% 0;background:var(--petal);opacity:.75;pointer-events:none;animation:fall linear infinite;transition:background .6s}
.tone{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5}
.tone button{white-space:nowrap;writing-mode:horizontal-tb;border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;letter-spacing:.2em;color:var(--sub);cursor:pointer}
.tone button.on{background:#fff;color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-3deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
@keyframes bsway{0%,100%{transform:scaleX(-1) rotate(6deg)}50%{transform:scaleX(-1) rotate(8.5deg)}}
@keyframes drift{to{transform:translateX(-7%)}}
@keyframes ink{from{opacity:0;filter:blur(7px);transform:translateY(-8px)}}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(1.8)}}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="sp" role="button" aria-label="进入江亭晚">
  <img class="art mist" src="raw/1040g3k0323l7109nna4g5o39q2709225ido6o50.jpeg" alt="">
  <img class="art br" src="raw/1040g3k831urrs7pqhu2g5pm1hgonefpbgtd63c0.jpeg" alt="">
  <img class="art lan" src="raw/1040g3k831urrs7pqhu205pm1hgonefpb4vncv68.jpeg" alt="">
  <div class="nm"><b class="me" id="nMe">江亭晚</b><i>长相思</i><b class="ta" id="nTa">顾时夜</b><span class="seal">晚</span></div>
  <div class="ft"><p id="day"></p><em>轻 触 入 内</em></div>
</div>
<div class="tone" id="tone"><button data-t="fen">樱粉</button><button data-t="zi">藕紫</button><button data-t="su">素墨</button></div>
<script>
(function(){
  // 他的名字从 app 存档里读，你的名字固定是江亭晚
  try{var S=JSON.parse(localStorage.getItem('mj_zika_v2')||'null');if(S&&S.ta&&S.ta.name)document.getElementById('nTa').textContent=S.ta.name}catch(e){}
  // 名字拆成一个个字，依次晕出来：先江亭晚，再他的名字
  document.querySelectorAll('.nm b').forEach(function(b,bi){
    var t=Array.from(b.textContent.replace(/\s/g,''));b.textContent='';
    t.forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(0.9+bi*0.9+i*0.3)+'s';b.appendChild(s)});
  });
  document.querySelectorAll('.nm i').forEach(function(el){
    var t=Array.from(el.textContent.replace(/\s/g,''));el.textContent='';
    t.forEach(function(ch){var s=document.createElement('span');s.textContent=ch;el.appendChild(s)});
  });
  // 「十月十九 · 寅时」
  var D='〇一二三四五六七八九';
  function cn(x){if(x<=10)return x===10?'十':D[x];if(x<20)return '十'+D[x-10];return D[Math.floor(x/10)]+'十'+(x%10?D[x%10]:'')}
  var d=new Date(),sc='子丑寅卯辰巳午未申酉戌亥'[Math.floor((d.getHours()+1)/2)%12];
  document.getElementById('day').textContent=cn(d.getMonth()+1)+'月'+cn(d.getDate())+' · '+sc+'时';

  // 白底变透明：越白越透，再把颜色从白里还原出来，淡淡的晕染边也留着
  function key(img,maxW){
    return new Promise(function(res){
      function go(){
        try{
          var s=Math.min(1,maxW/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
          var c=document.createElement('canvas');c.width=w;c.height=h;
          var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
          var dd=x.getImageData(0,0,w,h),p=dd.data;
          for(var i=0;i<p.length;i+=4){
            var r=Math.min(255,p[i]*255/246),g=Math.min(255,p[i+1]*255/246),bl=Math.min(255,p[i+2]*255/246);
            var a=(255-Math.min(r,g,bl))/255;
            if(a<0.015){p[i+3]=0;continue}
            var k=255*(1-a);
            p[i]=(r-k)/a;p[i+1]=(g-k)/a;p[i+2]=(bl-k)/a;p[i+3]=a*255;
          }
          x.putImageData(dd,0,0);
          c.toBlob(function(blob){res(blob?URL.createObjectURL(blob):null)},'image/png');
        }catch(e){res(null)}
      }
      if(img.complete&&img.naturalWidth)go();else img.addEventListener('load',go,{once:true});
    });
  }
  document.querySelectorAll('.art').forEach(function(img){
    key(img,1200).then(function(u){if(!u)return;img.src=u;img.classList.add('keyed')});
  });

  // 花瓣
  var sp=document.getElementById('sp');
  for(var i=0;i<18;i++){
    var p=document.createElement('span');p.className='pt';
    var s=6+Math.random()*9;
    p.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+(s*.72)+'px;animation-duration:'+(9+Math.random()*9)+'s;animation-delay:'+(-Math.random()*16)+'s;opacity:'+(.35+Math.random()*.5)+';--dx:'+(-60+Math.random()*140)+'px;--r:'+(180+Math.random()*540)+'deg';
    sp.appendChild(p);
  }
  // 换色（预览用，正式版跟着 app 配色走）
  var tone=document.getElementById('tone'),cur=localStorage.getItem('gf_tone')||'fen';
  function setT(t){document.documentElement.dataset.tone=t;tone.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});localStorage.setItem('gf_tone',t)}
  tone.addEventListener('click',function(e){var b=e.target.closest('button');if(b)setT(b.dataset.t)});
  setT(cur);
  sp.addEventListener('click',function(){sp.classList.add('out');setTimeout(function(){location.href='index.html'},580)});
})();
</script>
</body>
</html>
